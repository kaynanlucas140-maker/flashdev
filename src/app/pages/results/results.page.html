<ion-content [fullscreen]="true">
  <div class="results-container">

    <h2 class="titulo-comic" style="font-size: 2.8rem; margin-bottom: 1.5rem;">FIM DA <span>MISSÃO!</span></h2>

    <div class="score-box">
      <h1>{{ pontuacaoFinal }}/10</h1>
      <p>Conceitos Dominados</p>
    </div>

    <div class="patente-badge">
      {{ tituloNivel }}
    </div>

    <p class="feedback-texto">
      {{ fraseFeedback }}
    </p>

    <button class="btn-voltar" (click)="voltarParaHome()">
      &lt;&lt; Voltar ao Menu
    </button>

  </div>
</ion-content>
